<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="RPE-Harness — Local-First Verifiable Execution Kernel for Coding Agents">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.55"/>
    </pattern>
  </defs>

  <rect width="1200" height="280" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="280" rx="18" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="278" rx="17" fill="none" stroke="#1e293b" stroke-width="2"/>
  <rect x="0" y="0" width="1200" height="4" rx="2" fill="url(#accent)"/>

  <!-- Subtle top glow -->
  <ellipse cx="260" cy="40" rx="260" ry="90" fill="url(#glow)"/>

  <!-- Title block -->
  <text x="56" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="700" fill="#22d3ee" letter-spacing="2.4">LOCAL-FIRST · ZERO-DAEMON · EVIDENCE-FIRST</text>
  <text x="56" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="#f8fafc" letter-spacing="-0.8">RPE-Harness</text>
  <text x="364" y="120" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" fill="#10b981">v2.3.2</text>
  <text x="56" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#94a3b8">Let the LLM draft intent. Hand deterministic execution, independent oracles &amp; atomic cancellation to a local kernel.</text>

  <!-- 5-stage pipeline visualization -->
  <g transform="translate(56, 178)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">
    <rect x="0" y="0" width="176" height="42" rx="8" fill="#111c33" stroke="#334155"/>
    <text x="88" y="18" text-anchor="middle" fill="#cbd5e1">1 · LLM Draft</text>
    <text x="88" y="33" text-anchor="middle" font-size="10" fill="#64748b">Unprivileged Proposal</text>

    <path d="M 182 21 L 208 21" stroke="#22d3ee" stroke-width="2" stroke-dasharray="3 2"/>
    <polygon points="208,16 216,21 208,26" fill="#22d3ee"/>

    <rect x="220" y="0" width="190" height="42" rx="8" fill="#0d2230" stroke="#22d3ee"/>
    <text x="315" y="18" text-anchor="middle" fill="#67e8f9">2 · C2 SourceResolver</text>
    <text x="315" y="33" text-anchor="middle" font-size="10" fill="#22d3ee">0-Token Boundary Gate</text>

    <path d="M 416 21 L 442 21" stroke="#818cf8" stroke-width="2" stroke-dasharray="3 2"/>
    <polygon points="442,16 450,21 442,26" fill="#818cf8"/>

    <rect x="454" y="0" width="196" height="42" rx="8" fill="#1a1838" stroke="#818cf8"/>
    <text x="552" y="18" text-anchor="middle" fill="#c7d2fe">3 · C4 Digest Confirm</text>
    <text x="552" y="33" text-anchor="middle" font-size="10" fill="#818cf8">Host-Only Authority</text>

    <path d="M 656 21 L 682 21" stroke="#a78bfa" stroke-width="2" stroke-dasharray="3 2"/>
    <polygon points="682,16 690,21 682,26" fill="#a78bfa"/>

    <rect x="694" y="0" width="184" height="42" rx="8" fill="#111c33" stroke="#475569"/>
    <text x="786" y="18" text-anchor="middle" fill="#e2e8f0">4 · Deterministic Exec</text>
    <text x="786" y="33" text-anchor="middle" font-size="10" fill="#94a3b8">SQLite + Atomic Cancel</text>

    <path d="M 884 21 L 910 21" stroke="#10b981" stroke-width="2" stroke-dasharray="3 2"/>
    <polygon points="910,16 918,21 910,26" fill="#10b981"/>

    <rect x="922" y="0" width="166" height="42" rx="8" fill="#0b261f" stroke="#10b981"/>
    <text x="1005" y="18" text-anchor="middle" fill="#6ee7b7">5 · Independent Oracle</text>
    <text x="1005" y="33" text-anchor="middle" font-size="10" fill="#10b981">No-Overwrite Publish</text>
  </g>

  <!-- Footer metadata strip -->
  <text x="56" y="254" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#64748b">
    Linux (bwrap) · macOS (seatbelt) · Windows (Job Object)   |   MCP + Local Approval Inbox + 7 Verified Contracts   |   MIT License
  </text>
</svg>
