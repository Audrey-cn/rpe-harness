[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rpe-harness"
version = "2.0.0"
description = "State-driven capability addressing for persistent learning agents"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "openpyxl>=3.1.5,<3.2",
]

[project.scripts]
rpe-harness = "rpe_harness.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rpe_harness"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Keep the project's original Ruff checks stable across newer Ruff releases.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
