name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  linux-core:
    name: Linux Core, DSH & Lint (Ubuntu · Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install bubblewrap for Linux sandbox verification
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
      - name: Install package and dev dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Lint with Ruff
        run: ruff check src tests
      - name: Run portable C2/C4/A2/lifecycle/CLI/JSON/asset core tests
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          pytest -p no:cacheprovider -q
          -k "not test_registry_six_names and not test_assets_cli_adoption"
          tests/test_source_resolver.py
          tests/test_host_facade.py
          tests/test_cross_host_handoff.py
          tests/test_cancellation.py
          tests/test_cancel_interfaces.py
          tests/test_cancel_handler.py
          tests/test_cancel_worker_protocol.py
          tests/test_proposal_confirmation_boundaries.py
          tests/test_runtime.py
          tests/test_recovery.py
          tests/test_cli.py
          tests/test_json_runtime.py
          tests/test_proposal.py
          tests/test_intent.py
          tests/test_review_context.py
          tests/test_review_quote_contract.py
          tests/test_execution.py
          tests/test_assets.py
          tests/test_asset_cli.py
          tests/test_causal_graph.py
          tests/test_mcp_server.py
          tests/test_contract_sdk.py
          tests/test_sandbox_backends.py
      - name: Run DSH second-host Node.js full-loop E2E tests
        env:
          RPE_TEST_PYTHON: python
        run: node --test integrations/dsh/test.mjs

  macos-core:
    name: macOS Core & DSH Full-Loop (Python 3.12)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install package and dev dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Run C2/C4/A2 core suite on macOS
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          pytest -p no:cacheprovider -q
          tests/test_source_resolver.py
          tests/test_host_facade.py
          tests/test_cross_host_handoff.py
          tests/test_cancellation.py
          tests/test_cancel_interfaces.py
          tests/test_cancel_handler.py
          tests/test_cancel_worker_protocol.py
          tests/test_proposal_confirmation_boundaries.py
          tests/test_mcp_server.py
          tests/test_contract_sdk.py
          tests/test_sandbox_backends.py
      - name: Run DSH second-host Node.js full-loop E2E tests on macOS
        env:
          RPE_TEST_PYTHON: python
        run: node --test integrations/dsh/test.mjs

  windows-core:
    name: Windows Core & DSH Adapter (Python 3.12)
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install package and dev dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Run portable C2/C4/A2 core suite on Windows
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONUTF8: "1"
        run: >-
          pytest -p no:cacheprovider -v
          -k "not test_http_can_cancel_a_request_waiting_in_execution"
          tests/test_source_resolver.py
          tests/test_cross_host_handoff.py
          tests/test_cancel_interfaces.py
          tests/test_mcp_server.py
          tests/test_contract_sdk.py
          tests/test_sandbox_backends.py
      - name: Verify host CLI capabilities on Windows
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m rpe_harness host capabilities
