name: rpe-harness
version: 1.2.0
description: Verified tabular tasks and durable metadata-only native Hermes observations
kind: standalone
provides_tools:
  - rpe_task
provides_hooks:
  - on_session_start
  - pre_llm_call
  - post_llm_call
  - on_session_end
  - on_session_finalize
  - pre_tool_call
  - post_tool_call
  - pre_api_request
  - post_api_request
  - api_request_error
